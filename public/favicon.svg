<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="infomindGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#infomindGrad)"/>
  <!-- Central Brain / Mind Network Nodes -->
  <circle cx="24" cy="15" r="4.5" fill="#FFFFFF"/>
  <circle cx="15" cy="27" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="33" cy="27" r="4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="24" cy="35" r="3.5" fill="#FFFFFF" fill-opacity="0.95"/>
  <!-- Neural Link Lines -->
  <line x1="24" y1="15" x2="15" y2="27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="15" x2="33" y2="27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="27" x2="24" y2="35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="27" x2="24" y2="35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="27" x2="33" y2="27" stroke="#DBEAFE" stroke-width="1.8" stroke-dasharray="2 2"/>
  <!-- Pulse Accent -->
  <circle cx="24" cy="15" r="2" fill="#93C5FD"/>
</svg>
